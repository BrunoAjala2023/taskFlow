<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow</title>
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Task Flow</h1>
        <button class="dark-mode"> Dark Mode </button>
    </header>

    <main>
        <section class="summary">
           
            <p id="subtitle"> Organize suas tarefas e acompanhe seu progresso </p>

         <div class="container">

            <div class="card">
                <h2 class="total-number">0</h2>
                <p> Total </p>
            </div>

            <div class="card">
                <h2 class="pending-number">0</h2>
                <p> Pendentes </p>
            </div>

            <div class="card">  
                <h2 class="completed-number">0</h2>
                <p> Concluídas </p>
            </div>    

        </div>    
        </section>

        <section class="creation">
            <input class="task-input" placeholder="Digite uma nova tarefa..." type="text">
            <button class="task-button"> Adicionar </button>
        </section>

        <section class="filters">

        <div class="filter-buttons">    
            <button class="all-button"> Todas </button>
            <button class="pending-button"> Pendentes </button>
            <button class="completed-button"> Concluídas </button>
        </div>
        </section>

        <h2 id="subtitle-filters"> Minhas tarefas </h2>
        <p class="task-check"> Nenhuma tarefa cadastrada </p>

        <ul class="task-list"> </ul>
    </main>
    
</body>
</html>
